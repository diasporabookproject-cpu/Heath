name: Déploiement GitHub Pages

on:
  push:
    # Déploiement de la prod uniquement. La refonte Bento→Manzil a été fusionnée ici
    # (merge --no-ff, 2026-07-05) ; retour arrière trivial via le tag `pre-bento`.
    branches: [claude/jolly-wozniak-s83str]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 🔴 GARDE-FOU BLOQUANT (E1 + audit du 31/07) : aucun déploiement si les types, les
  # tests OU LES PARCOURS cassent. Les portes sont définies dans `portes.yml` et
  # partagées avec `ci.yml` — la prod ne peut donc plus être gardée moins sévèrement
  # qu'une branche de travail, et il n'existe pas deux copies qui dérivent.
  # Avant : `typecheck` + `test` seulement ; les 3 smokes ne gardaient pas la prod.
  portes:
    uses: ./.github/workflows/portes.yml

  build:
    needs: portes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # project pages : l'app est servie sous /Heath/ (nom exact du dépôt)
          BASE_PATH: /Heath/
          # Clés Supabase côté client (la publishable key est publique par design).
          VITE_SUPABASE_URL: https://pqeilsuqglmrvijndrwa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Gvhm9PdeleoilZGoeFiAtg_mGATsr1v
          # Sentry crash-reporting (DSN = clé d'ingestion publique, sans secret).
          VITE_SENTRY_DSN: https://0939a564afb426996c27804b976e4222@o4511683754983424.ingest.de.sentry.io/4511683834282064
      - uses: actions/configure-pages@v5
        with:
          # active automatiquement GitHub Pages (source = Actions) si pas déjà fait
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
