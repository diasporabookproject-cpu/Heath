name: Déploiement GitHub Pages

on:
  push:
    # `refonte/bento-v1` = prévue de la refonte sur l'URL de prod (décision Amine).
    # La branche de prod reste intacte ; à retirer avant/au moment du merge final.
    branches: [claude/jolly-wozniak-s83str, refonte/bento-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # project pages : l'app est servie sous /Heath/ (nom exact du dépôt)
          BASE_PATH: /Heath/
          # Clés Supabase côté client (la publishable key est publique par design).
          VITE_SUPABASE_URL: https://pqeilsuqglmrvijndrwa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Gvhm9PdeleoilZGoeFiAtg_mGATsr1v
      - uses: actions/configure-pages@v5
        with:
          # active automatiquement GitHub Pages (source = Actions) si pas déjà fait
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
