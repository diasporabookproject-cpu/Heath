name: CI (qualité + smoke)

# Leçon E1 portée EN CI : types + tests + build + parcours Playwright sur CHAQUE
# push et PR (toutes branches) — attraper les régressions AVANT le merge/déploiement.
# Les portes elles-mêmes vivent dans `portes.yml` (UN SEUL endroit), appelé ici ET
# par `deploy.yml` : c'est ce qui garantit que la prod n'est jamais gardée MOINS
# sévèrement qu'une branche de travail (décalage trouvé par l'audit du 31/07).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portes:
    uses: ./.github/workflows/portes.yml
