name: Portes (qualité + parcours)

# LES PORTES DU PROJET, DÉFINIES UNE SEULE FOIS.
#
# Pourquoi un workflow réutilisable plutôt que deux copies : l'audit du 31/07 a
# trouvé un **décalage de garde** — `ci.yml` lançait les 3 smokes sur chaque push,
# mais `deploy.yml` ne gardait la prod qu'avec `typecheck` + `test`. Les deux
# démarrent sur le même push et ne s'attendent pas : une régression de PARCOURS
# pouvait donc être publiée pendant que le smoke tournait encore, ou après qu'il
# avait rougi. Dupliquer le bloc dans les deux fichiers aurait recréé la dérive à
# la première évolution ; ici il n'existe qu'un seul endroit où les portes vivent,
# et `ci.yml` comme `deploy.yml` l'appellent.
on:
  workflow_call:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  smoke:
    needs: qualite
    runs-on: ubuntu-latest
    env:
      # base /Heath/ pour LE BUILD ET LE PREVIEW : sinon le preview sert en base '/'
      # et /Heath/assets/* tombe sur le fallback SPA (text/html) → l'app ne démarre pas.
      BASE_PATH: /Heath/
      BASE_URL: http://localhost:4173/Heath/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build web réel : a besoin des VITE_SUPABASE_* (clés PUBLIQUES par design ;
      # jamais de secret) — supabaseEnabled=true pour que l'écran Compte s'affiche.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://pqeilsuqglmrvijndrwa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Gvhm9PdeleoilZGoeFiAtg_mGATsr1v
      # Playwright global (le script a un fallback vers `npm root -g`), version alignée
      # sur l'environnement de dev ; le navigateur est téléchargé pour cette version.
      - run: npm i -g playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Preview + smokes
        run: |
          npx vite preview --port 4173 &
          PREV=$!
          for i in $(seq 1 30); do
            curl -sf "$BASE_URL" >/dev/null && break || sleep 1
          done
          set -e
          npm run smoke                         # parcours Cuisine (produit)
          node scripts/smoke-comptes.mjs        # parcours Compte hors-ligne + page de compte
          node scripts/smoke-ftue.mjs           # traversée FTUE réelle (gate + peuplement + rôles)
          kill $PREV 2>/dev/null || true
