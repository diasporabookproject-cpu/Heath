<body>

  <div class="head">
    <h1>Cuisine — prototype cliquable</h1>
    <p>Naviguez pour de vrai : footer, bouton Semaine, « Ajouter un repas » → radial, « Ma bibliothèque » → sélecteur. Le curseur ci-dessous simule une bibliothèque vide ou pleine.</p>
  </div>

    <span class="lbl">Bibliothèque</span>
    <div class="seg" id="libseg">
      <button data-lib="vide">Vide</button>
      <button data-lib="pleine" class="on">Pleine</button>
    </div>
  </div>

  <div class="phone">
    <div class="hd"><span class="hic">‹</span><span class="htitle">Cuisine</span><span class="spacer"></span><span class="rulepill" data-act="rules"><span data-em="herb" data-ch="🌿"></span> halal · sans arachide</span></div>
    <div class="scr" id="content"></div>
    <div class="foot" id="foot">
      <button class="fbtn" data-act="tab" data-val="menu"><span data-em="fork-and-knife-with-plate" data-ch="🍽️"></span><span>Menu</span></button>
      <button class="fbtn" data-act="tab" data-val="recettes"><span data-em="open-book" data-ch="📖"></span><span>Recettes</span></button>
      <button class="fbtn" data-act="tab" data-val="courses"><span data-em="shopping-cart" data-ch="🛒"></span><span>Courses</span></button>

<script>
  function makeEm(name, ch){
    var img=document.createElement('img'); img.className='em';
    img.src='https://api.iconify.design/fluent-emoji-flat/'+name+'.svg'; img.alt=ch||''; img.loading='lazy';
    img.onerror=function(){ var s=document.createElement('span'); s.className='sysem'; s.textContent=ch||''; if(img.parentNode) img.parentNode.replaceChild(s,img); };
    return img;
  }
  function decorate(root){ root.querySelectorAll('[data-em]').forEach(function(slot){ if(slot.dataset.done)return; slot.dataset.done='1'; slot.appendChild(makeEm(slot.getAttribute('data-em'), slot.getAttribute('data-ch'))); }); }

  var SLOTS=[
    {key:'petitdej',label:'Petit déjeuner',phrase:'Le petit déjeuner',cls:'s-petitdej',bg:'#fbe9d2',ink:'#b9781f'},
    {key:'dej',label:'Déjeuner',phrase:'Le déjeuner',cls:'s-dej',bg:'#e8efdf',ink:'#5f7a3f'},
    {key:'gouter',label:'Goûter',phrase:'Le goûter',cls:'s-gouter',bg:'#fbe4e0',ink:'#b56a5a'},
    {key:'diner',label:'Dîner',phrase:'Le dîner',cls:'s-diner',bg:'#dfeeeb',ink:'#3f7d72'}
  ];
  function slotMeta(k){ return SLOTS.find(function(s){return s.key===k}); }

  var RECIPES=[
    {id:'r1',em:'shallow-pan-of-food',ch:'🥘',name:'Couscous du vendredi',fav:true},
    {id:'r2',em:'pot-of-food',ch:'🍲',name:'Tajine de poulet aux olives',fav:true},
    {id:'r3',em:'poultry-leg',ch:'🍗',name:'Poulet rôti, pommes de terre'},
    {id:'r4',em:'green-salad',ch:'🥗',name:'Salade marocaine'},
    {id:'r5',em:'dumpling',ch:'🥟',name:'Briouates au fromage'}
  ];

  function freshMeals(lib){
    if(lib==='pleine') return { petitdej:{em:'cooking',ch:'🍳',name:'Msemmen, œufs & fromage'}, dej:{em:'shallow-pan-of-food',ch:'🥘',name:'Mezze, chermoula'}, gouter:null, diner:null };
    return { petitdej:null, dej:null, gouter:null, diner:null };
  }

  var S={ tab:'menu', menuView:'jour', lib:'pleine', meals:freshMeals('pleine'), curSlot:null, selCreate:false };

  /* ---------- RENDER ---------- */
  function renderMenuJour(){
    var allEmpty = SLOTS.every(function(s){return !S.meals[s.key]});
    var strip='';
    var days=[['Mer','15',true],['Jeu','16',false],['Ven','17',false],['Sam','18',false]];
    days.forEach(function(d,i){ strip+='<div class="day'+(i===1?' on':'')+'" data-act="day" data-val="'+i+'"><span class="dl">'+d[0]+'</span><span class="dn">'+d[1]+'</span><span class="tdot">'+(d[2]?'<i></i>':'')+'</span></div>'; });
    var rows='';
    SLOTS.forEach(function(s){
      var m=S.meals[s.key];
      if(m){ rows+='<div class="mrow '+s.cls+'" data-act="add-meal" data-slot="'+s.key+'"><span class="mchip"><span data-em="'+m.em+'" data-ch="'+m.ch+'"></span></span><span class="mid"><div class="mlabel">'+s.label+'</div><div class="mname">'+m.name+'</div></span><span class="chev">›</span></div>'; }
      else { rows+='<div class="mrow '+s.cls+'" data-act="add-meal" data-slot="'+s.key+'"><span class="mchip"><span class="plus">＋</span></span><span class="mid"><div class="mlabel">'+s.label+'</div><div class="addtx">Ajouter un repas</div></span><span class="chev">›</span></div>'; }
    });
    var welcome = allEmpty ? '<div class="welcome"><b>Composez votre premier menu ✨</b><p>Écrivez vos recettes, importez-les en quelques secondes depuis une photo ou un lien, ou piochez dans nos collections prêtes à servir.</p></div>' : '';
    var bottom = allEmpty ? '' : '<button class="ghost" data-act="copy">⧉ Copier une journée précédente</button><div class="sharewrap"><div class="share-primary" data-act="share">⤴ Partager la journée</div><div class="sharehint">Envoyer le menu à la personne de votre choix.</div></div>';
    return '<div class="selector"><div class="weekbtn" data-act="week-toggle"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1.3"/><rect x="9" y="1" width="6" height="6" rx="1.3"/><rect x="1" y="9" width="6" height="6" rx="1.3"/><rect x="9" y="9" width="6" height="6" rx="1.3"/></svg><span class="wl">Semaine ›</span></div><div class="sep"></div><div class="daystrip">'+strip+'</div></div><div class="datectx"><b>jeudi 16 juillet</b></div>'+welcome+'<div class="meals">'+rows+'</div>'+bottom;
  }
  function renderMenuSemaine(){
    var strip='';
    var days=[['Mer','15'],['Jeu','16'],['Ven','17'],['Sam','18']];
    days.forEach(function(d){ strip+='<div class="day dim"><span class="dl">'+d[0]+'</span><span class="dn">'+d[1]+'</span><span class="tdot"></span></div>'; });
    var w = S.lib==='pleine' ?
      '<div class="wday"><div class="wdh"><b>Mercredi <span class="wtag">· auj.</span></b><span class="wdd">15 juil.</span></div><div class="wln"><span class="wk m">P.déj</span><span class="wv">Msemmen, œufs</span></div><div class="wln"><span class="wk d">Déj</span><span class="wv">Mezze, chermoula</span></div><div class="wln empty"><span class="wk g">Goût</span><span class="wv">＋ Ajouter</span></div><div class="wln"><span class="wk s">Dîner</span><span class="wv">Tajine aux amandes</span></div></div><div class="wday"><div class="wdh"><b>Jeudi</b><span class="wdd">16 juil.</span></div><div class="wln"><span class="wk m">P.déj</span><span class="wv">Msemmen, œufs</span></div><div class="wln"><span class="wk d">Déj</span><span class="wv">Mezze, chermoula</span></div><div class="wln empty"><span class="wk g">Goût</span><span class="wv">＋ Ajouter</span></div><div class="wln empty"><span class="wk s">Dîner</span><span class="wv">＋ Ajouter</span></div></div><div class="wday"><div class="wdh"><b>Vendredi</b><span class="wdd">17 juil.</span></div><div class="wln empty"><span class="wk m">P.déj</span><span class="wv">＋ Ajouter</span></div><div class="wln"><span class="wk d">Déj</span><span class="wv">Couscous du vendredi</span></div><div class="wln empty"><span class="wk g">Goût</span><span class="wv">＋ Ajouter</span></div><div class="wln empty"><span class="wk s">Dîner</span><span class="wv">＋ Ajouter</span></div></div>'
      :
      '<div class="wday"><div class="wdh"><b>Mercredi <span class="wtag">· auj.</span></b><span class="wdd">15 juil.</span></div><div class="wln empty"><span class="wk m">P.déj</span><span class="wv">＋ Ajouter</span></div><div class="wln empty"><span class="wk d">Déj</span><span class="wv">＋ Ajouter</span></div><div class="wln empty"><span class="wk g">Goût</span><span class="wv">＋ Ajouter</span></div><div class="wln empty"><span class="wk s">Dîner</span><span class="wv">＋ Ajouter</span></div></div><div class="wday"><div class="wdh"><b>Jeudi</b><span class="wdd">16 juil.</span></div><div class="wln empty"><span class="wk m">P.déj</span><span class="wv">＋ Ajouter</span></div><div class="wln empty"><span class="wk d">Déj</span><span class="wv">＋ Ajouter</span></div><div class="wln empty"><span class="wk g">Goût</span><span class="wv">＋ Ajouter</span></div><div class="wln empty"><span class="wk s">Dîner</span><span class="wv">＋ Ajouter</span></div></div>';
    return '<div class="selector"><div class="weekbtn on" data-act="week-toggle"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1.3"/><rect x="9" y="1" width="6" height="6" rx="1.3"/><rect x="1" y="9" width="6" height="6" rx="1.3"/><rect x="9" y="9" width="6" height="6" rx="1.3"/></svg><span class="wl">Semaine</span></div><div class="sep"></div><div class="daystrip">'+strip+'</div></div><div class="wkhead">Semaine du 15 au 21 juillet</div><div class="wkdays">'+w+'</div><button class="ghost" data-act="copy">⧉ Copier une semaine précédente</button><div class="sharewrap"><div class="share-primary" data-act="share">⤴ Partager la semaine</div><div class="sharehint">Envoyer la semaine à la personne de votre choix.</div></div>';
  }
  function renderRecettes(){
    if(S.lib==='vide'){
      return '<div class="empty-hero"><div class="bigem"><span data-em="cook" data-ch="🧑‍🍳"></span></div><h3>Votre bibliothèque est vide</h3><p>Piochez dans une collection pour bien démarrer,<br>ou ajoutez vos propres recettes.</p></div><div class="startlabel">Pour démarrer · les collections</div><div class="colls-v"><div class="cx amber" data-act="install-coll"><span class="cxe"><span data-em="shallow-pan-of-food" data-ch="🥘"></span></span><span class="cxt"><b>Fonds de départ</b><i>Les essentiels du quotidien</i><span class="n">30 recettes</span></span><span class="cxg">›</span></div><div class="cx gold" data-act="install-coll"><span class="newb2">NOUVEAU</span><span class="cxe"><span data-em="crescent-moon" data-ch="🌙"></span></span><span class="cxt"><b>Ramadan</b><i>Pour le ftour et le shour</i><span class="n">20 recettes</span></span><span class="cxg">›</span></div><div class="cx sage" data-act="install-coll"><span class="newb2">NOUVEAU</span><span class="cxe"><span data-em="bento-box" data-ch="🍱"></span></span><span class="cxt"><b>Batch express</b><i>Des plats à congeler</i><span class="n">14 recettes</span></span><span class="cxg">›</span></div></div><a class="seeall" data-act="toast" data-msg="Toutes les collections">Voir toutes les collections →</a><div class="orcreate"><div class="ol">— ou —</div><button class="createbtn" data-act="toast" data-msg="Bientôt : créer une recette"><span class="p">＋</span> Créer ma première recette</button></div>';
    }
    return '<div class="searchrow"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><input placeholder="Rechercher…"></div><button class="startog" data-act="toast" data-msg="Filtrer les favoris"><svg viewBox="0 0 24 24"><path d="M12 3l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7L2 10.3l7-.8z"/></svg></button></div><div class="sig"><span class="se">✦</span><span class="st">2 recettes à relire · <i>2 min et c\'est réglé</i></span><span class="go" data-act="toast" data-msg="Relecture des brouillons">Relire</span></div><div class="sech"><b>Plats</b><span class="ct">6</span><span class="cv">⌄</span></div><div class="lib"><div class="row" data-act="toast" data-msg="Fiche recette (à concevoir)"><span class="rchip"><span data-em="pot-of-food" data-ch="🍲"></span></span><span class="rnm">Tajine de poulet aux olives</span></div><div class="row" data-act="toast" data-msg="Fiche recette (à concevoir)"><span class="rchip"><span data-em="shallow-pan-of-food" data-ch="🥘"></span></span><span class="rnm">Couscous du vendredi</span></div></div><div class="gap"></div><div class="sech"><b>Entrées</b><span class="ct">4</span><span class="cv">⌄</span></div><div class="lib"><div class="row" data-act="toast" data-msg="Fiche recette (à concevoir)"><span class="rchip"><span data-em="green-salad" data-ch="🥗"></span></span><span class="rnm">Salade marocaine</span></div></div><div class="gap"></div><div class="sech"><b>Soupes</b><span class="ct">1</span><span class="cv">⌄</span></div><div class="lib"><div class="row draft" data-act="toast" data-msg="Recette à valider"><span class="rchip"><span data-em="bowl-with-spoon" data-ch="🥣"></span></span><span class="rnm">Harira</span><span class="dtag">✦ À valider</span></div></div><div class="inspi"><h4>Besoin d\'inspiration ?</h4><div class="isub">Des collections à copier, puis à adapter.</div><div class="carousel"><div class="cc gold" data-act="toast" data-msg="Collection Ramadan"><span class="cce"><span data-em="crescent-moon" data-ch="🌙"></span></span><b>Ramadan</b><i>Ftour & shour</i><span class="n">20 recettes</span></div><div class="cc sage" data-act="toast" data-msg="Collection Batch express"><span class="cce"><span data-em="bento-box" data-ch="🍱"></span></span><b>Batch express</b><i>À congeler</i><span class="n">14 recettes</span></div><div class="cc rose" data-act="toast" data-msg="Collection Goûters"><span class="cce"><span data-em="cookie" data-ch="🍪"></span></span><b>Goûters</b><i>Petites faims</i><span class="n">12 recettes</span></div></div><a class="allink" data-act="toast" data-msg="Toutes les collections">Voir toutes les collections →</a></div>';
  }
  function renderCourses(){
    return '<div class="placeholder"><div class="pe"><span data-em="shopping-cart" data-ch="🛒"></span></div><h3>Les courses</h3><p>Cet écran reste à concevoir —<br>on l\'attaquera après la Cuisine.</p></div>';
  }

  function render(){
    var c=document.getElementById('content'); var html='';
    if(S.tab==='menu') html = S.menuView==='semaine' ? renderMenuSemaine() : renderMenuJour();
    else if(S.tab==='recettes') html = renderRecettes();
    else html = renderCourses();
    // FAB uniquement sur Recettes plein
    var fab = (S.tab==='recettes' && S.lib==='pleine') ? '<div class="fab" data-act="add-recettes">＋</div>' : '';
    c.innerHTML = html + fab;
    decorate(c);
    // footer active
    document.querySelectorAll('#foot .fbtn').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-val')===S.tab); });
  }

  /* ---------- OVERLAYS ---------- */
  function openRadial(slot){
    S.curSlot=slot; var m=slotMeta(slot); var o=document.getElementById('overlay');
    var petals = S.lib==='pleine' ?
      '<div class="petal p1" data-act="petal" data-val="biblio"><span class="pb"><span data-em="open-book" data-ch="📖"></span></span><span class="pl">Ma<br>bibliothèque</span></div><div class="petal p2" data-act="petal" data-val="ecrire"><span class="pb"><span data-em="pencil" data-ch="✏️"></span></span><span class="pl">L\'écrire</span></div><div class="petal p3" data-act="petal" data-val="photo"><span class="pb"><span data-em="camera-with-flash" data-ch="📸"></span></span><span class="pl">Photo<br>ou lien</span></div>'
      :
      '<div class="petal p1" data-act="petal" data-val="ecrire"><span class="pb"><span data-em="pencil" data-ch="✏️"></span></span><span class="pl">L\'écrire</span></div><div class="petal p2" data-act="petal" data-val="photo"><span class="pb"><span data-em="camera-with-flash" data-ch="📸"></span></span><span class="pl">Photo<br>ou lien</span></div><div class="petal p3" data-act="petal" data-val="collection"><span class="pb"><span data-em="books" data-ch="📚"></span></span><span class="pl">Depuis une<br>collection</span></div>';
    o.innerHTML = '<div class="dim" data-act="close-overlay"></div>'+petals+'<div class="srcrow"><span class="ml2" style="color:'+m.ink+'">'+m.label+'</span><span class="mchip" style="background:'+m.bg+'"><span class="plus">＋</span></span><span class="mn">'+m.phrase+'</span></div><div class="radclose" data-act="close-overlay">✕</div>';
    o.classList.add('show'); decorate(o);
  }
  function openSelector(){
    S.selCreate=false; var m=slotMeta(S.curSlot); var o=document.getElementById('overlay');
    o.innerHTML = buildSelector(m); o.classList.add('show'); decorate(o);
  }
  function buildSelector(m){
    var top = S.selCreate
      ? '<div class="ways"><div class="way" data-act="toast" data-msg="Bientôt : écrire la recette"><span class="we"><span data-em="pencil" data-ch="✏️"></span></span><b>L\'écrire</b></div><div class="way" data-act="toast" data-msg="Bientôt : photo ou lien"><span class="we"><span data-em="camera-with-flash" data-ch="📸"></span></span><b>Photo<br>ou lien</b></div><div class="way" data-act="toast" data-msg="Bientôt : une collection"><span class="we"><span data-em="books" data-ch="📚"></span></span><b>Une<br>collection</b></div></div>'
      : '<div class="newline" data-act="new-recipe"><span class="p">＋</span> Nouvelle recette</div>';
    var favs = RECIPES.filter(function(r){return r.fav}).map(function(r){ return '<div class="librow2" data-act="pick" data-id="'+r.id+'"><span class="rchip"><span data-em="'+r.em+'" data-ch="'+r.ch+'"></span></span><span class="rnm">'+r.name+'</span><span class="fstar"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7L2 9.3l7-.8z"/></svg></span></div>'; }).join('');
    var rest = RECIPES.filter(function(r){return !r.fav}).map(function(r){ return '<div class="librow2" data-act="pick" data-id="'+r.id+'"><span class="rchip"><span data-em="'+r.em+'" data-ch="'+r.ch+'"></span></span><span class="rnm">'+r.name+'</span></div>'; }).join('');
    return '<div class="dim" data-act="close-overlay"></div><div class="sheet"><div class="handle"></div><div class="sheethead"><div class="ttl">'+m.phrase+'<small>jeudi 16 juillet · Demain</small></div><div class="sx" data-act="close-overlay">✕</div></div><div class="sbody"><div class="search" style="margin-bottom:10px"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><input placeholder="Rechercher dans vos recettes…"></div>'+top+'<div class="sechs"><b>Favoris</b></div>'+favs+'<div class="sechs"><b>Toutes vos recettes</b></div>'+rest+'</div></div>';
  }
  function closeOverlay(){ var o=document.getElementById('overlay'); o.classList.remove('show'); o.innerHTML=''; }

  /* ---------- TOAST ---------- */
  var toastT;
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show')},1600); }

  /* ---------- DISPATCH ---------- */
  document.querySelector('.phone').addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if(!el) return;
    var act = el.getAttribute('data-act');
    if(act==='tab'){ S.tab=el.getAttribute('data-val'); if(S.tab==='menu') S.menuView='jour'; render(); }
    else if(act==='week-toggle'){ S.menuView = S.menuView==='semaine'?'jour':'semaine'; render(); }
    else if(act==='day'){ document.querySelectorAll('.daystrip .day').forEach(function(d){d.classList.remove('on')}); el.classList.add('on'); }
    else if(act==='add-meal'){ openRadial(el.getAttribute('data-slot')); }
    else if(act==='add-recettes'){ toast('Nouvelle recette : ✏️ · 📸 · 📚'); }
    else if(act==='close-overlay'){ closeOverlay(); }
    else if(act==='petal'){
      var v=el.getAttribute('data-val');
      if(v==='biblio'){ openSelector(); }
      else if(v==='collection'){ S.lib='pleine'; S.meals=freshMeals('vide'); /* library populated, meals still empty */ syncSeg(); closeOverlay(); render(); toast('Collection installée ✓'); }
      else if(v==='ecrire'){ S.meals[S.curSlot]={em:'fork-and-knife',ch:'🍴',name:'Votre plat'}; if(S.lib==='vide'){S.lib='pleine';syncSeg();} closeOverlay(); render(); toast('Plat ajouté ✓'); }
      else { toast('Bientôt : photo ou lien'); }
    }
    else if(act==='new-recipe'){ S.selCreate=true; var o=document.getElementById('overlay'); o.innerHTML=buildSelector(slotMeta(S.curSlot)); decorate(o); }
    else if(act==='pick'){ var r=RECIPES.find(function(x){return x.id===el.getAttribute('data-id')}); S.meals[S.curSlot]={em:r.em,ch:r.ch,name:r.name}; closeOverlay(); render(); toast('« '+r.name+' » ajouté ✓'); }
    else if(act==='install-coll'){ S.lib='pleine'; S.meals=freshMeals('vide'); syncSeg(); render(); toast('Collection installée ✓'); }
    else if(act==='rules'){ toast('Réglages · restrictions du foyer'); }
    else if(act==='copy'){ toast('Copier une journée…'); }
    else if(act==='share'){ toast('Partage : choisir le destinataire'); }
    else if(act==='toast'){ toast(el.getAttribute('data-msg')||'Bientôt'); }
  });

  /* dev seg */
  function syncSeg(){ document.querySelectorAll('#libseg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lib')===S.lib); }); }
  document.getElementById('libseg').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    S.lib=b.getAttribute('data-lib'); S.meals=freshMeals(S.lib); S.menuView='jour'; syncSeg(); closeOverlay(); render();
  });

  render();
  decorate(document.getElementById('foot'));
</script>
</body>
</html>
